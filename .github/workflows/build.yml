name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build ServiceBusConsole.slnx --configuration Release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test --project tests/ServiceBusConsole.Tests --configuration Release

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: tests/ServiceBusConsole.Tests/bin/Release/net10.0/TestResults/
