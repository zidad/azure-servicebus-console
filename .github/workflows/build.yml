name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build ServiceBusConsole.slnx --configuration Release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 tests

      - run: dotnet test --solution ServiceBusConsole.slnx --configuration Release --max-parallel-test-modules 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: tests/*/bin/Release/net10.0/TestResults/
