name: Publish

# Release by pushing a version tag from main: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x' # runtime for the net10.0 tests

      - name: Test
        run: dotnet test --solution ServiceBusConsole.slnx --configuration Release --max-parallel-test-modules 1

  packages:
    needs: test
    uses: ./.github/workflows/tool-packages.yml
    with:
      version: ${{ needs.test.outputs.version }}

  publish:
    needs: [test, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
      id-token: write # required for NuGet trusted publishing (OIDC)
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true

      - name: Checksums
        working-directory: archives
        run: sha256sum azsb-* | tee SHA256SUMS

      # Exchanges the job's GitHub OIDC token for a short-lived (1 hour) nuget.org
      # API key. Requires a trusted publishing policy on nuget.org for
      # zidad/azure-servicebus-console with workflow file "publish.yml".
      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: zidad

      # The platform packages first: installs fail while the top-level package points to a missing one.
      - name: Push to NuGet
        env:
          API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          top="packages/Net.Azure.ServiceBusConsole.$VERSION.nupkg"
          for package in packages/*.nupkg; do
            [[ "$package" == "$top" ]] && continue
            dotnet nuget push "$package" --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push "$top" --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
