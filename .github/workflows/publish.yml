name: Publish

# Release by pushing a version tag from main: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project tests/ServiceBusConsole.Tests --configuration Release

      # After the tests, which build without the version; pack --no-build uses this build.
      - name: Build
        run: dotnet build src/ServiceBusConsole/ServiceBusConsole.csproj --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack src/ServiceBusConsole/ServiceBusConsole.csproj --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./artifacts

      # Exchanges the job's GitHub OIDC token for a short-lived (1 hour) nuget.org
      # API key. Requires a trusted publishing policy on nuget.org for
      # zidad/azure-servicebus-console with workflow file "publish.yml".
      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: zidad

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/Net.Azure.ServiceBusConsole.*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
